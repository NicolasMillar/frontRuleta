<header #siteHeader class="navbar-container" [class.is-wide]="isWide()">
  <div #headerInner class="navbar-content">
    <!-- Logotipo y Nombre -->
    <a routerLink="/ruleta" class="brand-link">
      <span class="brand-icon" aria-hidden="true">🎰</span>
      <span class="brand-title">Ruleta<span class="brand-highlight">App</span></span>
    </a>

    <!-- Acciones y Navegación Superior -->
    <div class="navbar-actions">
      <!-- Landmark de navegación único para vista ancha y colapsada -->
      <nav class="site-nav" aria-label="Navegación principal" [class.locked-nav]="participantsService.isLoading()">
        <button type="button" class="menu-button" popovertarget="site-menu" popovertargetaction="toggle"
          aria-controls="site-menu" [disabled]="participantsService.isLoading()">
          <span class="menu-icon" aria-hidden="true">☰</span>
          <span>Menú</span>
        </button>

        <ul #siteMenu id="site-menu" class="nav-links" popover="auto">
          <li>
            <a routerLink="/ruleta" routerLinkActive="active-tab" ariaCurrentWhenActive="page" class="nav-tab"
              [class.disabled-tab]="participantsService.isLoading()"
              [attr.tabindex]="participantsService.isLoading() ? -1 : null"
              [attr.aria-disabled]="participantsService.isLoading() || null"
              (click)="closeMenuIfCollapsed()">
              <span class="tab-icon" aria-hidden="true">🎯</span>
              <span class="tab-label">Ruleta</span>
            </a>
          </li>

          <li>
            <a routerLink="/ranking" routerLinkActive="active-tab" ariaCurrentWhenActive="page" class="nav-tab"
              [class.disabled-tab]="participantsService.isLoading()"
              [attr.tabindex]="participantsService.isLoading() ? -1 : null"
              [attr.aria-disabled]="participantsService.isLoading() || null"
              (click)="closeMenuIfCollapsed()">
              <span class="tab-icon" aria-hidden="true">🏆</span>
              <span class="tab-label">Tabla de Posiciones</span>
              <span class="wins-badge" *ngIf="participantsService.totalWins() > 0">
                {{ participantsService.totalWins() }}
              </span>
            </a>
          </li>

          <li>
            <a routerLink="/historial" routerLinkActive="active-tab" ariaCurrentWhenActive="page" class="nav-tab"
              [class.disabled-tab]="participantsService.isLoading()"
              [attr.tabindex]="participantsService.isLoading() ? -1 : null"
              [attr.aria-disabled]="participantsService.isLoading() || null"
              (click)="closeMenuIfCollapsed()">
              <span class="tab-icon" aria-hidden="true">📅</span>
              <span class="tab-label">Historial</span>
            </a>
          </li>
        </ul>
      </nav>

      <!-- Botón de Sincronizar / Actualizar datos desde el API -->
      <button type="button" class="refresh-btn" (click)="participantsService.refreshFromApi()"
        [disabled]="participantsService.isLoading()" title="Actualizar datos desde el servidor">
        <span class="refresh-icon" [class.spinning]="participantsService.isLoading()" aria-hidden="true">🔄</span>
        <span class="refresh-text">{{ participantsService.isLoading() ? 'Cargando...' : 'Actualizar' }}</span>
      </button>
    </div>
  </div>
</header>
