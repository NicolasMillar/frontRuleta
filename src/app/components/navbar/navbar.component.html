<header class="navbar-container">
  <div class="navbar-content">
    <!-- Logotipo y Nombre -->
    <a routerLink="/ruleta" class="brand-link">
      <span class="brand-icon">🎰</span>
      <span class="brand-title">Ruleta<span class="brand-highlight">App</span></span>
    </a>

    <!-- Pestañas de Navegación Superior -->
    <nav class="nav-links">
      <a
        routerLink="/ruleta"
        routerLinkActive="active-tab"
        class="nav-tab"
      >
        <span class="tab-icon">🎯</span>
        <span class="tab-label">Ruleta</span>
      </a>

      <a
        routerLink="/ranking"
        routerLinkActive="active-tab"
        class="nav-tab"
      >
        <span class="tab-icon">🏆</span>
        <span class="tab-label">Tabla de Posiciones</span>
        <span class="wins-badge" *ngIf="participantsService.totalWins() > 0">
          {{ participantsService.totalWins() }}
        </span>
      </a>
    </nav>
  </div>
</header>
