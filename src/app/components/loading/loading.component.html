<div class="loading-wrapper">
  <div class="loading-card">
    <div class="spinner-container">
      <!-- Spinner Arco / Media luna minimalista -->
      <div class="spinner-arc"></div>
    </div>

    <!-- Textos informativos de carga -->
    <h3 class="loading-title">{{ message }}</h3>
    <p class="loading-subtitle">{{ subMessage }}</p>

    <!-- Barra de progreso simulada para dar sensación de actividad -->
    <div class="indeterminate-progress-bar">
      <div class="progress-bar-indicator"></div>
    </div>

    <div class="render-hint">
      <span class="hint-icon">⚡</span>
      <span>Si el servidor estaba inactivo, puede tomar unos segundos en despertar.</span>
    </div>
  </div>
</div>
