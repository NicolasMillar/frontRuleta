<div class="loading-wrapper" role="status" aria-live="polite">
  <div class="loading-card">
    <div class="spinner-container">
      <!-- Spinner nativo indeterminado (<progress> sin atributo value) -->
      <progress class="loading-spinner" [attr.aria-label]="message"></progress>
    </div>

    <!-- Textos informativos de carga -->
    <h2 class="loading-title">{{ message }}</h2>
    <p class="loading-subtitle">{{ subMessage }}</p>

    <!-- Barra de progreso indeterminada decorativa (el spinner ya anuncia el estado) -->
    <progress class="loading-progress" aria-hidden="true"></progress>

    <div class="render-hint">
      <span class="hint-icon" aria-hidden="true">⚡</span>
      <span>Si el servidor estaba inactivo, puede tomar unos segundos en despertar.</span>
    </div>
  </div>
</div>
