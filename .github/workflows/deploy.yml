name: Desplegar en GitHub Pages

on:
  push:
    branches:
      - master

# Permisos requeridos para desplegar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite una sola ejecución concurrente
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar proyecto Angular
        run: npm run build -- --base-href /frontRuleta/

      - name: Crear 404.html para rutas SPA de Angular
        run: cp dist/front-ruleta/browser/index.html dist/front-ruleta/browser/404.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto de compilación
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist/front-ruleta/browser'

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

